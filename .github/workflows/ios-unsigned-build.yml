name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Download ONNX Model
        run: |
          mkdir -p tools/face_model/models
          curl -L "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip" \
            -o tools/face_model/buffalo_sc.zip
          unzip -o tools/face_model/buffalo_sc.zip -d tools/face_model/buffalo_sc
          find tools/face_model/buffalo_sc -name "*.onnx" -exec ls -la {} \;
          cp tools/face_model/buffalo_sc/*w600k_mbf*.onnx tools/face_model/models/w600k_mbf.onnx 2>/dev/null || \
          cp tools/face_model/buffalo_sc/*mbf*.onnx tools/face_model/models/w600k_mbf.onnx 2>/dev/null || \
          cp $(find tools/face_model/buffalo_sc -name "*.onnx" -not -name "det*" | head -1) tools/face_model/models/w600k_mbf.onnx

      - name: Install Pods
        run: pod install

      - name: Build Unsigned iPhone App
        run: |
          xcodebuild \
            -workspace EyePal.xcworkspace \
            -scheme EyePal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Bundle Localized Strings
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/EyePal.app"
          mkdir -p "$APP_PATH/en.lproj" "$APP_PATH/zh-Hant.lproj"
          cp EyePal/Resources/en.lproj/Localizable.strings "$APP_PATH/en.lproj/"
          cp EyePal/Resources/zh-Hant.lproj/Localizable.strings "$APP_PATH/zh-Hant.lproj/"

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/EyePal.app"
          test -d "$APP_PATH"
          rm -rf Payload EyePal-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/EyePal.app
          ditto -c -k --sequesterRsrc --keepParent Payload EyePal-unsigned.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: EyePal-unsigned-ipa
          path: EyePal-unsigned.ipa
