name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # Xcode 27 is required: the Apple Foundation Model image-input API ships in
    # the iOS 27 SDK, which the macos-latest (macOS 26 / Xcode 26) image lacks.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Pods
        run: pod install

      - name: Build Unsigned iPhone App
        run: |
          xcodebuild \
            -workspace EyePal.xcworkspace \
            -scheme EyePal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Bundle Localized Strings
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/EyePal.app"
          mkdir -p "$APP_PATH/en.lproj" "$APP_PATH/zh-Hant.lproj"
          cp EyePal/Resources/en.lproj/Localizable.strings "$APP_PATH/en.lproj/"
          cp EyePal/Resources/zh-Hant.lproj/Localizable.strings "$APP_PATH/zh-Hant.lproj/"

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/EyePal.app"
          test -d "$APP_PATH"
          rm -rf Payload EyePal-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/EyePal.app
          ditto -c -k --sequesterRsrc --keepParent Payload EyePal-unsigned.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: EyePal-unsigned-ipa
          path: EyePal-unsigned.ipa
          retention-days: 1
